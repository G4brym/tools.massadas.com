<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Cropper &amp; Resizer — tools.massadas.com</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand: #6366f1;
      --color-brand-light: #818cf8;
      --color-surface: #0f172a;
      --color-surface-light: #1e293b;
      --color-surface-lighter: #334155;
      --color-err: #ef4444;
      --color-warn: #f59e0b;
      --color-ok: #22c55e;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      height: 1.25rem;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: var(--color-surface-lighter);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-brand);
      margin-top: -6px;
      border: 2px solid var(--color-surface);
    }
    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: var(--color-surface-lighter);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-brand);
      border: 2px solid var(--color-surface);
    }
  </style>
  <!-- Cropper.js CSS inlined (MIT license) -->
  <style>

ty:.75;width:5px}.cropper-point.point-e{cursor:ew-resize;margin-top:-3px;right:-3px;top:50%}.cropper-point.point-n{cursor:ns-resize;left:50%;margin-left:-3px;top:-3px}.cropper-point.point-w{cursor:ew-resize;left:-3px;margin-top:-3px;top:50%}.cropper-point.point-s{bottom:-3px;cursor:s-resize;left:50%;margin-left:-3px}.cropper-point.point-ne{cursor:nesw-resize;right:-3px;top:-3px}.cropper-point.point-nw{cursor:nwse-resize;left:-3px;top:-3px}.cropper-point.point-sw{bottom:-3px;cursor:nesw-resize;left:-3px}.cropper-point.point-se{bottom:-3px;cursor:nwse-resize;height:20px;opacity:1;right:-3px;width:20px}@media (min-width:768px){.cropper-point.point-se{height:15px;width:15px}}@media (min-width:992px){.cropper-point.point-se{height:10px;width:10px}}@media (min-width:1200px){.cropper-point.point-se{height:5px;opacity:.75;width:5px}}.cropper-point.point-se:before{background-color:#39f;bottom:-50%;content:" ";display:block;height:200%;opacity:0;position:absolute;right:-50%;width:200%}.cropper-invisible{opacity:0}.cropper-bg{background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQAQMAAAAlPW0iAAAAA3NCSVQICAjb4U/gAAAABlBMVEXMzMz////TjRV2AAAACXBIWXMAAArrAAAK6wGCiw1aAAAAHHRFWHRTb2Z0d2FyZQBBZG9iZSBGaXJld29ya3MgQ1M26LyyjAAAABFJREFUCJlj+M/AgBVhF/0PAH6/D/HkDxOGAAAAAElFTkSuQmCC")}.cropper-hide{display:block;height:0;position:absolute;width:0}.cropper-hidden{display:none!important}.cropper-move{cursor:move}.cropper-crop{cursor:crosshair}.cropper-disabled .cropper-drag-box,.cropper-disabled .cropper-face,.cropper-disabled .cropper-line,.cropper-disabled .cropper-point{cursor:not-allowed}

<body class="bg-surface text-gray-100 min-h-screen antialiased">

  <!-- Top bar -->
  <header class="border-b border-surface-lighter bg-surface-light/80 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-4 px-4 h-12">
      <a href="/" class="text-sm text-gray-400 hover:text-brand-light transition">&larr; tools</a>
      <h1 class="text-sm font-semibold text-gray-200">Image Cropper &amp; Resizer</h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex flex-col gap-6">

    <!-- Error display -->
    <div id="error-box" class="hidden bg-err/10 border border-err/40 text-err rounded-xl px-5 py-3 text-sm"></div>

    <!-- Drop zone -->
    <div id="drop-zone" class="bg-surface-light border-2 border-dashed border-surface-lighter rounded-xl p-10 flex flex-col items-center justify-center gap-3 text-center cursor-pointer hover:border-brand transition">
      <div class="text-4xl">&#9986;</div>
      <p class="text-sm text-gray-300 font-medium">Drag &amp; drop an image here</p>
      <p class="text-xs text-gray-500">or click to select — PNG, JPEG, WebP, GIF, BMP, TIFF</p>
      <input id="file-input" type="file" accept="image/*" class="hidden">
      <button type="button" onclick="document.getElementById('file-input').click()"
        class="mt-1 px-5 py-2 text-sm font-medium rounded-lg bg-brand text-white hover:bg-brand-light transition cursor-pointer">
        Select Image
      </button>
    </div>

    <!-- Cropper section (hidden until image loaded) -->
    <div id="cropper-section" class="hidden flex flex-col gap-6">

      <!-- Image info + reset -->
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <div id="file-info" class="text-sm text-gray-400"></div>
        <button id="btn-reset" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
          &#8635; Load new image
        </button>
      </div>

      <!-- Cropper canvas -->
      <div class="bg-surface-light border border-surface-lighter rounded-xl p-3 overflow-hidden">
        <div style="max-height:480px; overflow:hidden;">
          <img id="crop-image" style="display:block;max-width:100%;">
        </div>
      </div>

      <!-- Crop dimensions readout -->
      <div class="flex items-center gap-3 flex-wrap">
        <span class="text-xs text-gray-500 font-medium uppercase tracking-wide">Crop area:</span>
        <span id="crop-dims" class="text-sm font-mono text-brand-light">—</span>
      </div>

      <!-- Controls row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Aspect ratio -->
        <div class="bg-surface-light border border-surface-lighter rounded-xl p-5">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Aspect Ratio</p>
          <div class="flex flex-wrap gap-2" id="ratio-btns">
            <button data-ratio="NaN" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-brand text-white transition cursor-pointer">Free</button>
            <button data-ratio="1" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">1:1</button>
            <button data-ratio="1.3333" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">4:3</button>
            <button data-ratio="1.7778" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">16:9</button>
            <button data-ratio="1.5" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">3:2</button>
            <button data-ratio="0.5625" class="ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">9:16</button>
          </div>
        </div>

        <!-- Transform -->
        <div class="bg-surface-light border border-surface-lighter rounded-xl p-5">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Transform</p>
          <div class="flex flex-wrap gap-2">
            <button id="btn-rotate-left" title="Rotate left 90°"
              class="px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
              &#8634; 90°
            </button>
            <button id="btn-rotate-right" title="Rotate right 90°"
              class="px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
              &#8635; 90°
            </button>
            <button id="btn-flip-h" title="Flip horizontal"
              class="px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
              &#8596; Flip H
            </button>
            <button id="btn-flip-v" title="Flip vertical"
              class="px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
              &#8597; Flip V
            </button>
          </div>
          <!-- Zoom -->
          <div class="mt-4">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs text-gray-400">Zoom</span>
              <span id="zoom-val" class="text-xs font-mono text-brand-light">1.00×</span>
            </div>
            <input type="range" id="zoom-slider" min="0.1" max="3" step="0.05" value="1" class="w-full">
          </div>
        </div>
      </div>

      <!-- Output options -->
      <div class="bg-surface-light border border-surface-lighter rounded-xl p-5 flex flex-col gap-5">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Output Options</p>

        <!-- Resize -->
        <div>
          <div class="flex items-center gap-2 mb-3">
            <span class="text-sm font-medium text-gray-300">Resize output</span>
            <label class="flex items-center gap-1.5 ml-auto cursor-pointer text-xs text-gray-400">
              <input type="checkbox" id="lock-ratio" checked class="w-3.5 h-3.5 accent-brand cursor-pointer">
              Lock ratio
            </label>
          </div>
          <div class="flex items-center gap-3 flex-wrap">
            <div class="flex items-center gap-2">
              <label class="text-xs text-gray-500 w-10">Width</label>
              <input type="number" id="out-width" min="1" max="8000" placeholder="auto"
                class="w-24 bg-surface border border-surface-lighter rounded-lg px-3 py-1.5 text-sm text-gray-100 focus:border-brand focus:outline-none font-mono">
              <span class="text-xs text-gray-500">px</span>
            </div>
            <span class="text-gray-600 hidden sm:inline">×</span>
            <div class="flex items-center gap-2">
              <label class="text-xs text-gray-500 w-10">Height</label>
              <input type="number" id="out-height" min="1" max="8000" placeholder="auto"
                class="w-24 bg-surface border border-surface-lighter rounded-lg px-3 py-1.5 text-sm text-gray-100 focus:border-brand focus:outline-none font-mono">
              <span class="text-xs text-gray-500">px</span>
            </div>
            <button id="btn-clear-resize" class="text-xs text-gray-500 hover:text-gray-300 transition cursor-pointer underline">Clear</button>
          </div>
        </div>

        <!-- Format + quality -->
        <div class="flex flex-wrap gap-4 items-end border-t border-surface-lighter pt-4">
          <div>
            <label class="text-xs text-gray-500 block mb-1.5">Format</label>
            <select id="out-format"
              class="bg-surface border border-surface-lighter rounded-lg px-3 py-1.5 text-sm text-gray-100 focus:border-brand focus:outline-none cursor-pointer">
              <option value="image/png">PNG</option>
              <option value="image/jpeg" selected>JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </div>
          <div id="quality-group" class="flex-1 min-w-40">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs text-gray-500">Quality</label>
              <span id="quality-val" class="text-xs font-mono text-brand-light">0.92</span>
            </div>
            <input type="range" id="quality-slider" min="0.1" max="1" step="0.01" value="0.92" class="w-full">
          </div>
        </div>
      </div>

      <!-- Result info (shown after crop) -->
      <div id="result-info" class="hidden bg-ok/10 border border-ok/30 rounded-xl px-5 py-3 text-sm text-ok"></div>

      <!-- Crop & Download button -->
      <button id="btn-crop"
        class="w-full py-3 text-sm font-semibold rounded-xl bg-brand text-white hover:bg-brand-light transition cursor-pointer">
        Crop &amp; Download
      </button>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let cropper = null;
    let flipScaleX = 1;
    let flipScaleY = 1;
    let currentZoom = 1;
    let adjustingZoomSlider = false;

    // ─── DOM refs ─────────────────────────────────────────────────────────────
    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const cropperSection = document.getElementById('cropper-section');
    const cropImage      = document.getElementById('crop-image');
    const errorBox       = document.getElementById('error-box');
    const fileInfoEl     = document.getElementById('file-info');
    const cropDimsEl     = document.getElementById('crop-dims');
    const zoomSlider     = document.getElementById('zoom-slider');
    const zoomValEl      = document.getElementById('zoom-val');
    const outWidth       = document.getElementById('out-width');
    const outHeight      = document.getElementById('out-height');
    const lockRatio      = document.getElementById('lock-ratio');
    const outFormat      = document.getElementById('out-format');
    const qualitySlider  = document.getElementById('quality-slider');
    const qualityValEl   = document.getElementById('quality-val');
    const qualityGroup   = document.getElementById('quality-group');
    const resultInfo     = document.getElementById('result-info');
    const btnCrop        = document.getElementById('btn-crop');
    const btnReset       = document.getElementById('btn-reset');

    // ─── Error helper ─────────────────────────────────────────────────────────
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function clearError() {
      errorBox.classList.add('hidden');
      errorBox.textContent = '';
    }

    // ─── File handling ────────────────────────────────────────────────────────
    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function loadFile(file) {
      clearError();
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showError('Please select a valid image file (PNG, JPEG, WebP, GIF, BMP, etc.).');
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        showError('File is too large (max 50 MB).');
        return;
      }

      const url = URL.createObjectURL(file);
      cropImage.src = url;
      fileInfoEl.textContent = file.name + ' — ' + formatBytes(file.size);
      dropZone.classList.add('hidden');
      cropperSection.classList.remove('hidden');
      resultInfo.classList.add('hidden');

      // Destroy previous cropper
      if (cropper) { cropper.destroy(); cropper = null; }
      flipScaleX = 1; flipScaleY = 1; currentZoom = 1;
      zoomSlider.value = 1;
      zoomValEl.textContent = '1.00×';
      outWidth.value = '';
      outHeight.value = '';

      // Set active ratio button to Free
      setActiveRatio(document.querySelector('[data-ratio="NaN"]'));

      cropImage.onload = () => {
        cropper = new Cropper(cropImage, {
          aspectRatio: NaN,
          viewMode: 1,
          autoCropArea: 0.8,
          responsive: true,
          restore: false,
          background: true,
          movable: true,
          rotatable: true,
          scalable: true,
          zoomable: true,
          zoomOnTouch: true,
          zoomOnWheel: true,
          cropBoxMovable: true,
          cropBoxResizable: true,
          ready() {
            updateCropDims();
            // Seed width/height with natural crop size
            const d = cropper.getCropBoxData();
            const cd = cropper.getData(true);
            outWidth.value = cd.width || '';
            outHeight.value = cd.height || '';
          },
          cropend() { updateCropDims(); },
          crop() { updateCropDims(); },
          zoom(e) {
            currentZoom = e.detail.ratio;
            if (!adjustingZoomSlider) {
              zoomSlider.value = Math.min(3, Math.max(0.1, currentZoom));
              zoomValEl.textContent = currentZoom.toFixed(2) + '×';
            }
          }
        });
      };
    }

    function updateCropDims() {
      if (!cropper) return;
      const d = cropper.getData(true);
      cropDimsEl.textContent = Math.round(d.width) + ' × ' + Math.round(d.height) + ' px';
      // Auto-fill resize fields when lock is on
      if (lockRatio.checked) {
        const w = parseInt(outWidth.value);
        const h = parseInt(outHeight.value);
        if (w && d.width) {
          outHeight.value = Math.round(w * (d.height / d.width));
        } else if (h && d.height) {
          outWidth.value = Math.round(h * (d.width / d.height));
        }
      }
    }

    // ─── Drop zone events ─────────────────────────────────────────────────────
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('border-brand'); });
    dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-brand'); });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('border-brand');
      const file = e.dataTransfer.files[0];
      if (file) loadFile(file);
    });
    dropZone.addEventListener('click', e => {
      if (e.target.tagName !== 'BUTTON') fileInput.click();
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadFile(fileInput.files[0]);
      fileInput.value = '';
    });

    // ─── Reset ────────────────────────────────────────────────────────────────
    btnReset.addEventListener('click', () => {
      if (cropper) { cropper.destroy(); cropper = null; }
      cropImage.src = '';
      dropZone.classList.remove('hidden');
      cropperSection.classList.add('hidden');
      clearError();
    });

    // ─── Aspect ratio buttons ─────────────────────────────────────────────────
    function setActiveRatio(activeBtn) {
      document.querySelectorAll('.ratio-btn').forEach(btn => {
        btn.className = btn === activeBtn
          ? 'ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-brand text-white transition cursor-pointer'
          : 'ratio-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer';
      });
    }

    document.getElementById('ratio-btns').addEventListener('click', e => {
      const btn = e.target.closest('.ratio-btn');
      if (!btn || !cropper) return;
      setActiveRatio(btn);
      const r = parseFloat(btn.dataset.ratio);
      cropper.setAspectRatio(isNaN(r) ? NaN : r);
    });

    // ─── Rotate ───────────────────────────────────────────────────────────────
    document.getElementById('btn-rotate-left').addEventListener('click', () => {
      if (cropper) cropper.rotate(-90);
    });
    document.getElementById('btn-rotate-right').addEventListener('click', () => {
      if (cropper) cropper.rotate(90);
    });

    // ─── Flip ─────────────────────────────────────────────────────────────────
    document.getElementById('btn-flip-h').addEventListener('click', () => {
      if (!cropper) return;
      flipScaleX *= -1;
      cropper.scaleX(flipScaleX);
    });
    document.getElementById('btn-flip-v').addEventListener('click', () => {
      if (!cropper) return;
      flipScaleY *= -1;
      cropper.scaleY(flipScaleY);
    });

    // ─── Zoom slider ──────────────────────────────────────────────────────────
    zoomSlider.addEventListener('input', () => {
      if (!cropper) return;
      adjustingZoomSlider = true;
      const z = parseFloat(zoomSlider.value);
      cropper.zoomTo(z);
      zoomValEl.textContent = z.toFixed(2) + '×';
      adjustingZoomSlider = false;
    });

    // ─── Resize inputs — lock ratio ───────────────────────────────────────────
    outWidth.addEventListener('input', () => {
      if (!cropper || !lockRatio.checked) return;
      const w = parseInt(outWidth.value);
      if (!w) return;
      const d = cropper.getData(true);
      if (d.width && d.height) {
        outHeight.value = Math.round(w * (d.height / d.width));
      }
    });
    outHeight.addEventListener('input', () => {
      if (!cropper || !lockRatio.checked) return;
      const h = parseInt(outHeight.value);
      if (!h) return;
      const d = cropper.getData(true);
      if (d.width && d.height) {
        outWidth.value = Math.round(h * (d.width / d.height));
      }
    });

    document.getElementById('btn-clear-resize').addEventListener('click', () => {
      outWidth.value = '';
      outHeight.value = '';
    });

    // ─── Format — hide quality for PNG ────────────────────────────────────────
    outFormat.addEventListener('change', () => {
      qualityGroup.style.visibility = outFormat.value === 'image/png' ? 'hidden' : 'visible';
    });

    // ─── Quality slider ───────────────────────────────────────────────────────
    qualitySlider.addEventListener('input', () => {
      qualityValEl.textContent = parseFloat(qualitySlider.value).toFixed(2);
    });

    // ─── Crop & Download ──────────────────────────────────────────────────────
    btnCrop.addEventListener('click', () => {
      if (!cropper) { showError('Load an image first.'); return; }
      clearError();

      const format = outFormat.value;
      const quality = format === 'image/png' ? undefined : parseFloat(qualitySlider.value);
      const w = parseInt(outWidth.value) || 0;
      const h = parseInt(outHeight.value) || 0;

      let canvas;
      try {
        canvas = cropper.getCroppedCanvas(
          (w || h) ? { width: w || undefined, height: h || undefined, imageSmoothingQuality: 'high' } : { imageSmoothingQuality: 'high' }
        );
      } catch (err) {
        showError('Could not crop the image: ' + err.message);
        return;
      }

      if (!canvas) { showError('Crop failed — the crop area may be empty.'); return; }

      const resultW = canvas.width;
      const resultH = canvas.height;

      canvas.toBlob(blob => {
        if (!blob) { showError('Failed to encode image. Try a different format.'); return; }

        const ext = format === 'image/png' ? 'png' : format === 'image/webp' ? 'webp' : 'jpg';
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cropped.' + ext;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        resultInfo.textContent =
          'Downloaded: ' + resultW + ' × ' + resultH + ' px — ' + formatBytes(blob.size) +
          ' (' + format.split('/')[1].toUpperCase() + ')';
        resultInfo.classList.remove('hidden');
      }, format, quality);
    });
  </script>
</body>
</html>
