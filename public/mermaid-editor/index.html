  <style type="text/tailwindcss">
    @theme {
      --color-brand: #6366f1;
      --color-brand-light: #818cf8;
      --color-surface: #0f172a;
      --color-surface-light: #1e293b;
      --color-surface-lighter: #334155;
      --color-err: #ef4444;
      --color-warn: #f59e0b;
      --color-ok: #22c55e;

    .editor-pane {
      height: calc(100vh - 3rem - 3.5rem - 2rem);
      min-height: 400px;

    @media (max-width: 767px) {
      .editor-pane {
        height: 50vh;

      resize: none;
      tab-size: 2;
    }
    #preview-area svg {
      max-width: 100%;
      height: auto;

      width: 1.5rem;

<body class="bg-surface text-gray-100 min-h-screen antialiased">

  <!-- Top bar -->
  <header class="border-b border-surface-lighter bg-surface-light/80 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-4 px-4 h-12">
      <a href="/" class="text-sm text-gray-400 hover:text-brand-light transition">&larr; tools</a>
      <h1 class="text-sm font-semibold text-gray-200">Mermaid Diagram Editor</h1>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="border-b border-surface-lighter bg-surface-light px-4 py-2 flex flex-wrap items-center gap-2">
    <!-- Example diagrams dropdown -->
    <select id="examples-select" class="bg-surface border border-surface-lighter rounded-lg px-3 py-1.5 text-sm text-gray-300 focus:border-brand focus:outline-none cursor-pointer">
      <option value="">Load example…</option>
      <option value="flowchart">Flowchart</option>
      <option value="sequence">Sequence Diagram</option>
      <option value="class">Class Diagram</option>
      <option value="state">State Diagram</option>
      <option value="er">ER Diagram</option>
      <option value="gantt">Gantt Chart</option>
      <option value="pie">Pie Chart</option>
      <option value="gitgraph">Git Graph</option>
    </select>

    <div class="flex-1"></div>

    <!-- Mobile toggle -->
    <div class="flex md:hidden rounded-lg border border-surface-lighter overflow-hidden">
      <button id="btn-show-edit" class="px-3 py-1.5 text-xs font-medium bg-brand text-white transition cursor-pointer">Edit</button>
      <button id="btn-show-preview" class="px-3 py-1.5 text-xs font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer">Preview</button>
    </div>

    <!-- Action buttons -->
    <button id="btn-copy-source" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">Copy Source</button>
    <button id="btn-export-svg" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">↓ SVG</button>
    <button id="btn-export-png" class="px-4 py-1.5 text-sm font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">↓ PNG</button>
  </div>

  <!-- Split editor -->
  <main class="max-w-6xl mx-auto px-4 py-4">
    <div class="flex flex-col md:flex-row gap-4">

      <!-- Left: Editor -->
      <div id="panel-edit" class="flex-1 flex flex-col editor-pane">
        <div class="text-xs text-gray-500 mb-1.5 font-mono">Source</div>
        <textarea
          id="source-textarea"
          spellcheck="false"
          class="flex-1 w-full font-mono text-sm bg-surface-light border border-surface-lighter rounded-xl px-4 py-3 text-gray-100 focus:border-brand focus:outline-none leading-relaxed"
          placeholder="Enter Mermaid diagram source…"
        ></textarea>
      </div>

      <!-- Right: Preview -->
      <div id="panel-preview" class="flex-1 flex flex-col editor-pane">
        <div class="text-xs text-gray-500 mb-1.5">Preview</div>
        <div class="flex-1 bg-surface-light border border-surface-lighter rounded-xl overflow-auto relative">

          <!-- Loading spinner -->
          <div id="spinner" class="hidden absolute inset-0 flex items-center justify-center bg-surface-light/70 z-10">
            <div class="spinner"></div>
          </div>

          <!-- Error card -->
          <div id="error-card" class="hidden m-4 bg-err/10 border border-err/40 rounded-lg px-4 py-3">
            <p class="text-xs font-semibold text-err mb-1">Syntax Error</p>
            <pre id="error-text" class="text-xs text-red-300 whitespace-pre-wrap font-mono leading-relaxed"></pre>
          </div>

          <!-- Rendered SVG container -->
          <div id="preview-area" class="p-4 flex items-center justify-center min-h-full"></div>
        </div>
      </div>

    </div>

    <!-- Status bar -->
    <div class="mt-2 flex items-center gap-4 text-xs text-gray-500">
      <span id="status-text">Ready</span>
      <span class="ml-auto" id="char-count"></span>
    </div>
  </main>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    // --- Initialize mermaid ---
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      darkMode: true,
      securityLevel: 'loose',
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
    });

    // --- Example diagrams ---
    const EXAMPLES = {
      flowchart: `flowchart TD
    A[Start] --> B{Is it working?}
    B -- Yes --> C[Great!]
    B -- No --> D[Debug]
    D --> E[Fix the issue]
    E --> B
    C --> F[Deploy]`,

      sequence: `sequenceDiagram
    participant Browser
    participant Server
    participant DB

    Browser->>Server: GET /api/data
    Server->>DB: SELECT * FROM items
    DB-->>Server: rows[]
    Server-->>Browser: 200 OK {data}
    Browser->>Browser: Render UI`,

      class: `classDiagram
    class Animal {
        +String name
        +int age
        +makeSound() String
    }
    class Dog {
        +String breed
        +fetch() void
    }
    class Cat {
        +bool indoor
        +purr() void
    }
    Animal <|-- Dog
    Animal <|-- Cat`,

      state: `stateDiagram-v2
    [*] --> Idle
    Idle --> Loading : fetch()
    Loading --> Success : data received
    Loading --> Error : request failed
    Success --> Idle : reset()
    Error --> Idle : retry()
    Error --> [*] : abort()`,

      er: `erDiagram
    USER {
        int id PK
        string email
        string name
        datetime created_at
    }
    POST {
        int id PK
        int user_id FK
        string title
        text body
        datetime published_at
    }
    COMMENT {
        int id PK
        int post_id FK
        int user_id FK
        text content
    }
    USER ||--o{ POST : "writes"
    POST ||--o{ COMMENT : "has"
    USER ||--o{ COMMENT : "writes"`,

      gantt: `gantt
    title Project Roadmap
    dateFormat YYYY-MM-DD
    section Planning
        Requirements     :done,    req,  2024-01-01, 2024-01-14
        Architecture     :done,    arch, 2024-01-10, 10d
    section Development
        Backend API      :active,  api,  2024-01-20, 30d
        Frontend UI      :         ui,   2024-02-01, 25d
    section Launch
        QA Testing       :         qa,   2024-02-20, 10d
        Deployment       :         dep,  2024-03-01, 3d`,

      pie: `pie title Browser Market Share
    "Chrome" : 65.4
    "Safari" : 18.9
    "Firefox" : 4.0
    "Edge" : 4.7
    "Other" : 7.0`,

      gitgraph: `gitGraph
    commit id: "Initial commit"
    commit id: "Add README"
    branch feature/auth
    checkout feature/auth
    commit id: "Add login page"
    commit id: "Add JWT middleware"
    checkout main
    branch feature/api
    checkout feature/api
    commit id: "Add REST endpoints"
    checkout main
    merge feature/auth id: "Merge auth"
    merge feature/api id: "Merge API"
    commit id: "v1.0.0 release"`,
    };

    // --- DOM refs ---
    const textarea = document.getElementById('source-textarea');
    const previewArea = document.getElementById('preview-area');
    const errorCard = document.getElementById('error-card');
    const errorText = document.getElementById('error-text');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');
    const charCount = document.getElementById('char-count');
    const examplesSelect = document.getElementById('examples-select');
    const btnCopySource = document.getElementById('btn-copy-source');
    const btnExportSvg = document.getElementById('btn-export-svg');
    const btnExportPng = document.getElementById('btn-export-png');
    const btnShowEdit = document.getElementById('btn-show-edit');
    const btnShowPreview = document.getElementById('btn-show-preview');
    const panelEdit = document.getElementById('panel-edit');
    const panelPreview = document.getElementById('panel-preview');

    const LS_KEY = 'mermaid-editor-source';

    // --- Last good SVG for export ---
    let lastGoodSvg = '';
    let renderCounter = 0;

    // --- Debounce ---
    function debounce(fn, ms) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), ms);
      };
    }

    // --- Render ---
    async function renderDiagram(source) {
      const src = source.trim();
      if (!src) {
        hideSpinner();
        previewArea.innerHTML = '<p class="text-gray-600 text-sm">Start typing a Mermaid diagram…</p>';
        errorCard.classList.add('hidden');
        statusText.textContent = 'Ready';
        return;
      }

      showSpinner();
      statusText.textContent = 'Rendering…';

      // Unique ID per render to avoid mermaid caching issues
      const id = 'mermaid-render-' + (++renderCounter);

      try {
        const { svg } = await mermaid.render(id, src);
        lastGoodSvg = svg;
        errorCard.classList.add('hidden');
        previewArea.innerHTML = svg;
        statusText.textContent = 'OK';
      } catch (err) {
        // Show error inline, keep last good render
        errorCard.classList.remove('hidden');
        const msg = err?.message || String(err);
        errorText.textContent = msg;
        statusText.textContent = 'Error';
        // Don't clear preview — keep last good SVG
      } finally {
        hideSpinner();
      }
    }

    function showSpinner() {
      spinner.classList.remove('hidden');
    }

    function hideSpinner() {
      spinner.classList.add('hidden');
    }

    const debouncedRender = debounce(renderDiagram, 400);

    // --- Textarea events ---
    textarea.addEventListener('input', () => {
      const src = textarea.value;
      localStorage.setItem(LS_KEY, src);
      charCount.textContent = src.length + ' chars';
      debouncedRender(src);
    });

    // Tab key support in textarea
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 2;
        // Trigger input event
        textarea.dispatchEvent(new Event('input'));
      }
    });

    // --- Examples ---
    examplesSelect.addEventListener('change', () => {
      const key = examplesSelect.value;
      if (!key || !EXAMPLES[key]) return;
      textarea.value = EXAMPLES[key];
      examplesSelect.value = '';
      localStorage.setItem(LS_KEY, textarea.value);
      charCount.textContent = textarea.value.length + ' chars';
      renderDiagram(textarea.value);
    });

    // --- Copy source ---
    btnCopySource.addEventListener('click', async () => {
      const src = textarea.value;
      if (!src) return;
      try {
        await navigator.clipboard.writeText(src);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = src;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const orig = btnCopySource.textContent;
      btnCopySource.textContent = 'Copied!';
      setTimeout(() => { btnCopySource.textContent = orig; }, 1500);
    });

    // --- Export SVG ---
    btnExportSvg.addEventListener('click', () => {
      if (!lastGoodSvg) return;
      const blob = new Blob([lastGoodSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagram.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    // --- Export PNG (2x via canvas) ---
    btnExportPng.addEventListener('click', async () => {
      if (!lastGoodSvg) return;

      const svgEl = previewArea.querySelector('svg');
      if (!svgEl) return;

      const scale = 2;
      const bbox = svgEl.getBoundingClientRect();
      const w = Math.ceil(bbox.width) || 800;
      const h = Math.ceil(bbox.height) || 600;

      // Serialize the SVG with explicit dimensions
      const svgClone = svgEl.cloneNode(true);
      svgClone.setAttribute('width', w);
      svgClone.setAttribute('height', h);
      // Add white background for PNG
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('width', '100%');
      rect.setAttribute('height', '100%');
      rect.setAttribute('fill', '#0f172a');
      svgClone.insertBefore(rect, svgClone.firstChild);

      const svgData = new XMLSerializer().serializeToString(svgClone);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(svgUrl);

        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'diagram.png';
          a.click();
          URL.revokeObjectURL(url);
        }, 'image/png');
      };
      img.onerror = () => {
        URL.revokeObjectURL(svgUrl);
        statusText.textContent = 'PNG export failed';
      };
      img.src = svgUrl;
    });

    // --- Mobile toggle ---
    function setMobilePanel(panel) {
      if (panel === 'edit') {
        panelEdit.classList.remove('hidden');
        panelPreview.classList.add('hidden');
        btnShowEdit.className = 'px-3 py-1.5 text-xs font-medium bg-brand text-white transition cursor-pointer';
        btnShowPreview.className = 'px-3 py-1.5 text-xs font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer';
      } else {
        panelEdit.classList.add('hidden');
        panelPreview.classList.remove('hidden');
        btnShowEdit.className = 'px-3 py-1.5 text-xs font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer';
        btnShowPreview.className = 'px-3 py-1.5 text-xs font-medium bg-brand text-white transition cursor-pointer';
      }
    }

    btnShowEdit.addEventListener('click', () => setMobilePanel('edit'));
    btnShowPreview.addEventListener('click', () => setMobilePanel('preview'));

    // Show both panels on desktop (md+), toggle on mobile
    function applyResponsiveLayout() {
      if (window.innerWidth >= 768) {
        panelEdit.classList.remove('hidden');
        panelPreview.classList.remove('hidden');
      } else {
        // Keep current mobile panel state — only fix if both hidden or both shown incorrectly
        const editHidden = panelEdit.classList.contains('hidden');
        const previewHidden = panelPreview.classList.contains('hidden');
        if (!editHidden && !previewHidden) {
          // Transitioned from desktop: show edit panel
          setMobilePanel('edit');
        }
      }
    }

    window.addEventListener('resize', applyResponsiveLayout);

    // --- Load from localStorage ---
    const saved = localStorage.getItem(LS_KEY);
    const initial = saved || EXAMPLES.flowchart;
    textarea.value = initial;
    charCount.textContent = initial.length + ' chars';

    // Initial render
    renderDiagram(initial);
  </script>
</body>
</html>
