<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Converter — tools.massadas.com</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-brand: #6366f1;
      --color-brand-light: #818cf8;
      --color-surface: #0f172a;
      --color-surface-light: #1e293b;
      --color-surface-lighter: #334155;
    }
  </style>
</head>
<body class="bg-surface text-gray-100 min-h-screen antialiased">

  <header class="border-b border-surface-lighter bg-surface-light/80 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-4 px-4 h-12">
      <a href="/" class="text-sm text-gray-400 hover:text-brand-light transition">&larr; tools</a>
      <h1 class="text-sm font-semibold text-gray-200">Color Converter</h1>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4 sm:px-6 py-8">

    <!-- Color preview -->
    <div id="swatch" class="w-full h-28 sm:h-40 rounded-2xl border border-surface-lighter mb-8 transition-colors" style="background:#6366f1"></div>

    <!-- Picker row -->
    <div class="flex flex-wrap items-center gap-3 sm:gap-4 mb-8">
      <label class="text-sm text-gray-400">Pick:</label>
      <input type="color" id="picker" value="#6366f1" class="w-12 h-10 rounded-lg border border-surface-lighter bg-transparent cursor-pointer" />
      <input type="text" id="any-input" placeholder="Paste any color (hex, rgb, hsl, oklch...)" class="flex-1 bg-surface-light border border-surface-lighter rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none focus:border-brand placeholder:text-gray-600" />
    </div>

    <!-- Format outputs -->
    <div class="space-y-3" id="formats">
      <div class="flex items-center gap-3">
        <label class="w-16 text-xs text-gray-500 uppercase tracking-wide text-right shrink-0">HEX</label>
        <input type="text" id="out-hex" readonly class="flex-1 bg-surface-light border border-surface-lighter rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none" />
        <button class="copy-btn text-xs text-gray-400 hover:text-brand-light transition cursor-pointer" data-target="out-hex">Copy</button>
      </div>
      <div class="flex items-center gap-3">
        <label class="w-16 text-xs text-gray-500 uppercase tracking-wide text-right shrink-0">RGB</label>
        <input type="text" id="out-rgb" readonly class="flex-1 bg-surface-light border border-surface-lighter rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none" />
        <button class="copy-btn text-xs text-gray-400 hover:text-brand-light transition cursor-pointer" data-target="out-rgb">Copy</button>
      </div>
      <div class="flex items-center gap-3">
        <label class="w-16 text-xs text-gray-500 uppercase tracking-wide text-right shrink-0">HSL</label>
        <input type="text" id="out-hsl" readonly class="flex-1 bg-surface-light border border-surface-lighter rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none" />
        <button class="copy-btn text-xs text-gray-400 hover:text-brand-light transition cursor-pointer" data-target="out-hsl">Copy</button>
      </div>
      <div class="flex items-center gap-3">
        <label class="w-16 text-xs text-gray-500 uppercase tracking-wide text-right shrink-0">oklch</label>
        <input type="text" id="out-oklch" readonly class="flex-1 bg-surface-light border border-surface-lighter rounded-lg px-3 py-2 text-sm text-gray-200 font-mono focus:outline-none" />
        <button class="copy-btn text-xs text-gray-400 hover:text-brand-light transition cursor-pointer" data-target="out-oklch">Copy</button>
      </div>
    </div>

    <!-- RGB sliders -->
    <div class="mt-8 space-y-3">
      <h2 class="text-xs text-gray-500 uppercase tracking-wide mb-2">Adjust</h2>
      <div class="flex items-center gap-3">
        <label class="w-8 text-xs text-red-400 text-right">R</label>
        <input type="range" id="slider-r" min="0" max="255" class="flex-1 accent-red-500" />
        <span id="val-r" class="w-8 text-xs text-gray-400 text-right font-mono">0</span>
      </div>
      <div class="flex items-center gap-3">
        <label class="w-8 text-xs text-green-400 text-right">G</label>
        <input type="range" id="slider-g" min="0" max="255" class="flex-1 accent-green-500" />
        <span id="val-g" class="w-8 text-xs text-gray-400 text-right font-mono">0</span>
      </div>
      <div class="flex items-center gap-3">
        <label class="w-8 text-xs text-blue-400 text-right">B</label>
        <input type="range" id="slider-b" min="0" max="255" class="flex-1 accent-blue-500" />
        <span id="val-b" class="w-8 text-xs text-gray-400 text-right font-mono">0</span>
      </div>
    </div>

  </div>

  <script>
    const picker = document.getElementById('picker');
    const anyInput = document.getElementById('any-input');
    const swatch = document.getElementById('swatch');
    const outHex = document.getElementById('out-hex');
    const outRgb = document.getElementById('out-rgb');
    const outHsl = document.getElementById('out-hsl');
    const outOklch = document.getElementById('out-oklch');
    const sliderR = document.getElementById('slider-r');
    const sliderG = document.getElementById('slider-g');
    const sliderB = document.getElementById('slider-b');
    const valR = document.getElementById('val-r');
    const valG = document.getElementById('val-g');
    const valB = document.getElementById('val-b');

    // Hidden element for browser-based color parsing
    const probe = document.createElement('div');
    document.body.appendChild(probe);
    probe.style.display = 'none';

    let currentRgb = { r: 99, g: 102, b: 241 }; // brand color default

    // --- Parse any CSS color via the browser ---
    function parseColor(str) {
      str = str.trim();
      if (!str) return null;

      // Let the browser parse it
      probe.style.color = '';
      probe.style.color = str;
      const computed = getComputedStyle(probe).color;
      if (!computed || computed === '') return null;

      // computed is usually rgb(r, g, b) or rgba(r, g, b, a)
      const m = computed.match(/rgba?\(\s*([\d.]+),?\s*([\d.]+),?\s*([\d.]+)/);
      if (!m) return null;
      return { r: Math.round(+m[1]), g: Math.round(+m[2]), b: Math.round(+m[3]) };
    }

    // --- Conversions ---
    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    function rgbToOklch(r, g, b) {
      // Use the browser to convert via CSS
      probe.style.color = `rgb(${r}, ${g}, ${b})`;
      // Force computed style in oklch by using a trick with CSS
      // We'll compute it mathematically instead for precision

      // Linear sRGB
      const toLinear = (c) => {
        c /= 255;
        return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      };
      const lr = toLinear(r), lg = toLinear(g), lb = toLinear(b);

      // sRGB to XYZ (D65)
      const x = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
      const y = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
      const z = 0.0883024619 * lr + 0.2024326889 * lg + 0.6890572493 * lb;

      // XYZ to Oklab
      const l_ = Math.cbrt(0.8189330101 * x + 0.3618667424 * y - 0.1288597137 * z);
      const m_ = Math.cbrt(0.0329845436 * x + 0.9293118715 * y + 0.0361456387 * z);
      const s_ = Math.cbrt(0.0482003018 * x + 0.2643662691 * y + 0.6338517070 * z);

      const L = 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_;
      const a = 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_;
      const bk = 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_;

      // Oklab to Oklch
      const C = Math.sqrt(a * a + bk * bk);
      let H = Math.atan2(bk, a) * 180 / Math.PI;
      if (H < 0) H += 360;

      return {
        l: +(L * 100).toFixed(2),
        c: +C.toFixed(4),
        h: +H.toFixed(2)
      };
    }

    // --- Update all outputs ---
    function updateFromRgb(rgb, source) {
      currentRgb = rgb;
      const { r, g, b } = rgb;

      swatch.style.background = `rgb(${r}, ${g}, ${b})`;

      const hex = rgbToHex(r, g, b);
      const hsl = rgbToHsl(r, g, b);
      const oklch = rgbToOklch(r, g, b);

      outHex.value = hex;
      outRgb.value = `rgb(${r}, ${g}, ${b})`;
      outHsl.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
      outOklch.value = `oklch(${oklch.l}% ${oklch.c} ${oklch.h})`;

      if (source !== 'picker') picker.value = hex;
      if (source !== 'slider') {
        sliderR.value = r; valR.textContent = r;
        sliderG.value = g; valG.textContent = g;
        sliderB.value = b; valB.textContent = b;
      }
    }

    // --- Event listeners ---
    picker.addEventListener('input', () => {
      const hex = picker.value;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      updateFromRgb({ r, g, b }, 'picker');
    });

    let debounceTimer;
    anyInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const parsed = parseColor(anyInput.value);
        if (parsed) updateFromRgb(parsed, 'input');
      }, 300);
    });

    [sliderR, sliderG, sliderB].forEach(slider => {
      slider.addEventListener('input', () => {
        const r = +sliderR.value, g = +sliderG.value, b = +sliderB.value;
        valR.textContent = r;
        valG.textContent = g;
        valB.textContent = b;
        updateFromRgb({ r, g, b }, 'slider');
      });
    });

    // --- Copy buttons ---
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const target = document.getElementById(btn.dataset.target);
        await navigator.clipboard.writeText(target.value);
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      });
    });

    // Init
    updateFromRgb(currentRgb, 'init');
  </script>
</body>
</html>
