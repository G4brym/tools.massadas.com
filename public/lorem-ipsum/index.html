        case 'last_name':      rec[fid] = last; break;
        case 'full_name':      rec[fid] = `${first} ${last}`; break;
        case 'email':          rec[fid] = genEmail(first, last); break;
        case 'username':       rec[fid] = genUsername(first, last); break;
        case 'phone':          rec[fid] = genPhone(); break;
        case 'street_address': rec[fid] = `${rndInt(9900)+100} ${pick(STREET_NAMES)}`; break;
        case 'city':           rec[fid] = pick(CITIES); break;
        case 'country':        rec[fid] = pick(COUNTRIES); break;
        case 'company':        rec[fid] = pick(COMPANIES); break;
        case 'job_title':      rec[fid] = pick(JOB_TITLES); break;
        case 'uuid':           rec[fid] = genUUID(); break;
        case 'ipv4':           rec[fid] = genIPv4(); break;
        case 'date':           rec[fid] = genDate(); break;
        case 'integer':        rec[fid] = rndInt(1000000) + 1; break;
        case 'price':          rec[fid] = (rndFloat(0.99, 9999.99)).toFixed(2); break;
        case 'boolean':        rec[fid] = rndInt(2) === 0 ? 'true' : 'false'; break;
        case 'color_hex': {
          const b = new Uint8Array(3);
          crypto.getRandomValues(b);
          rec[fid] = '#' + Array.from(b).map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
          break;
        }
        case 'lorem_sentence': rec[fid] = genLoremSentence(); break;
      }
    }
    return rec;
  }

  function generateFakeData() {
    if (activeFields.size === 0) {
      showFakeError('Select at least one field.');
      return;
    }
    hideFakeError();
    const count = parseInt(document.getElementById('row-count').value, 10);
    fakeData = [];
    for (let i = 0; i < count; i++) fakeData.push(genRecord());
    renderFakeOutput();
  }

  function renderFakeOutput() {
    if (fakeData.length === 0) return;
    const fields = [...activeFields];
    const labels = fields.map(fid => FIELD_DEFS.find(f => f.id === fid)?.label || fid);

    document.getElementById('fake-stats').textContent = `${fakeData.length} rows · ${fields.length} columns`;

    if (fakeFormat === 'table') {
      document.getElementById('fake-table-wrap').classList.remove('hidden');
      document.getElementById('fake-text-output').classList.add('hidden');
      renderTable(fields, labels, fakeData);
    } else {
      document.getElementById('fake-table-wrap').classList.add('hidden');
      const ta = document.getElementById('fake-text-output');
      ta.classList.remove('hidden');
      if (fakeFormat === 'json') {
        ta.value = JSON.stringify(fakeData, null, 2);
      } else if (fakeFormat === 'csv') {
        ta.value = buildCSV(fields, labels, fakeData);
      } else if (fakeFormat === 'sql') {
        ta.value = buildSQL(fields, fakeData);
      }
    }
  }

  function renderTable(fields, labels, rows) {
    const table = document.getElementById('fake-table');
    // header
    let html = '<thead><tr>';
    html += '<th>#</th>';
    labels.forEach(l => { html += `<th>${escHtml(l)}</th>`; });
    html += '</tr></thead><tbody>';
    const limit = Math.min(rows.length, 500); // cap preview to 500 for perf
    for (let i = 0; i < limit; i++) {
      html += '<tr>';
      html += `<td class="text-gray-500">${i+1}</td>`;
      fields.forEach(fid => { html += `<td title="${escHtml(String(rows[i][fid]))}">${escHtml(String(rows[i][fid]))}</td>`; });
      html += '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
    if (rows.length > 500) {
      document.getElementById('fake-stats').textContent += ` (showing first 500)`;
    }
  }

  function buildCSV(fields, labels, rows) {
    const escape = v => {
      const s = String(v);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) return `"${s.replace(/"/g,'""')}"`;
      return s;
    };
    const lines = [labels.map(escape).join(',')];
    rows.forEach(r => lines.push(fields.map(f => escape(r[f])).join(',')));
    return lines.join('\n');
  }

  function buildSQL(fields, rows) {
    const table = 'fake_data';
    const cols = fields.join(', ');
    const lines = [];
    rows.forEach(r => {
      const vals = fields.map(f => {
        const v = r[f];
        if (typeof v === 'number' || v === 'true' || v === 'false') return v;
        return `'${String(v).replace(/'/g, "''")}'`;
      }).join(', ');
      lines.push(`INSERT INTO ${table} (${cols}) VALUES (${vals});`);
    });
    return lines.join('\n');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showFakeError(msg) {
    const el = document.getElementById('fake-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function hideFakeError() {
    document.getElementById('fake-error').classList.add('hidden');
  }

  // =========================================================
  // UI INIT
  // =========================================================
  let loremMode = 'paragraphs';

  // Build field chips
  function buildFieldChips() {
    const container = document.getElementById('field-chips');
    container.innerHTML = '';
    FIELD_DEFS.forEach(fd => {
      const btn = document.createElement('button');
      btn.textContent = fd.label;
      btn.dataset.field = fd.id;
      btn.className = `field-chip px-3 py-1 text-xs rounded-full border cursor-pointer transition ${activeFields.has(fd.id) ? 'field-chip-active' : 'field-chip-inactive'}`;
      btn.addEventListener('click', () => {
        if (activeFields.has(fd.id)) activeFields.delete(fd.id);
        else activeFields.add(fd.id);
        btn.className = `field-chip px-3 py-1 text-xs rounded-full border cursor-pointer transition ${activeFields.has(fd.id) ? 'field-chip-active' : 'field-chip-inactive'}`;
      });
      container.appendChild(btn);
    });
  }

  function refreshChips() {
    document.querySelectorAll('.field-chip').forEach(btn => {
      const fid = btn.dataset.field;
      btn.className = `field-chip px-3 py-1 text-xs rounded-full border cursor-pointer transition ${activeFields.has(fid) ? 'field-chip-active' : 'field-chip-inactive'}`;
    });
  }

  // Tab switching
  function setTab(tab) {
    const panelLorem = document.getElementById('panel-lorem');
    const panelFake  = document.getElementById('panel-fake');
    const tabLorem   = document.getElementById('tab-lorem');
    const tabFake    = document.getElementById('tab-fake');
    if (tab === 'lorem') {
      panelLorem.classList.remove('hidden');
      panelFake.classList.add('hidden');
      tabLorem.className = 'flex-1 px-4 py-2.5 text-sm font-medium tab-active transition cursor-pointer text-center';
      tabFake.className  = 'flex-1 px-4 py-2.5 text-sm font-medium tab-inactive transition cursor-pointer text-center';
    } else {
      panelLorem.classList.add('hidden');
      panelFake.classList.remove('hidden');
      tabLorem.className = 'flex-1 px-4 py-2.5 text-sm font-medium tab-inactive transition cursor-pointer text-center';
      tabFake.className  = 'flex-1 px-4 py-2.5 text-sm font-medium tab-active transition cursor-pointer text-center';
    }
  }

  // Lorem mode switching
  function setLoremMode(m) {
    loremMode = m;
    document.querySelectorAll('.lorem-mode-btn').forEach(btn => {
      if (btn.dataset.mode === m) {
        btn.className = 'lorem-mode-btn px-4 py-1.5 text-sm rounded-lg bg-brand text-white transition cursor-pointer';
      } else {
        btn.className = 'lorem-mode-btn px-4 py-1.5 text-sm rounded-lg bg-surface border border-surface-lighter text-gray-400 hover:border-brand hover:text-brand-light transition cursor-pointer';
      }
    });
    const countLabel = document.getElementById('lorem-count-label');
    const sppRow = document.getElementById('spp-row');
    const slider = document.getElementById('lorem-count');
    if (m === 'paragraphs') {
      countLabel.textContent = 'Paragraphs';
      slider.max = 20;
      if (parseInt(slider.value) > 20) { slider.value = 20; document.getElementById('lorem-count-value').textContent = 20; }
      sppRow.classList.remove('hidden');
    } else if (m === 'sentences') {
      countLabel.textContent = 'Sentences';
      slider.max = 50;
      sppRow.classList.add('hidden');
    } else {
      countLabel.textContent = 'Words';
      slider.max = 500;
      sppRow.classList.add('hidden');
    }
    generateLorem();
  }

  // Format switching
  function setFakeFormat(fmt) {
    fakeFormat = fmt;
    document.querySelectorAll('.fake-fmt-btn').forEach(btn => {
      if (btn.dataset.fmt === fmt) {
        btn.className = 'fake-fmt-btn px-3 py-1.5 text-xs rounded-lg bg-brand text-white transition cursor-pointer';
      } else {
        btn.className = 'fake-fmt-btn px-3 py-1.5 text-xs rounded-lg bg-surface border border-surface-lighter text-gray-400 hover:border-brand hover:text-brand-light transition cursor-pointer';
      }
    });
    if (fakeData.length > 0) renderFakeOutput();
  }

  // Copy helper
  async function copyText(text, btn) {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }

  // Download helper
  function downloadText(text, filename) {
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // =========================================================
  // EVENT LISTENERS
  // =========================================================
  document.getElementById('tab-lorem').addEventListener('click', () => setTab('lorem'));
  document.getElementById('tab-fake').addEventListener('click',  () => setTab('fake'));

  document.querySelectorAll('.lorem-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => setLoremMode(btn.dataset.mode));
  });

  document.getElementById('lorem-count').addEventListener('input', e => {
    document.getElementById('lorem-count-value').textContent = e.target.value;
    generateLorem();
  });
  document.getElementById('spp-count').addEventListener('input', e => {
    document.getElementById('spp-count-value').textContent = e.target.value;
    generateLorem();
  });
  document.getElementById('opt-lorem-start').addEventListener('change', generateLorem);
  document.getElementById('btn-lorem-generate').addEventListener('click', generateLorem);

  document.getElementById('btn-lorem-copy').addEventListener('click', async () => {
    const text = document.getElementById('lorem-output').textContent;
    await copyText(text, document.getElementById('btn-lorem-copy'));
  });

  document.querySelectorAll('.fake-fmt-btn').forEach(btn => {
    btn.addEventListener('click', () => setFakeFormat(btn.dataset.fmt));
  });

  document.getElementById('row-count').addEventListener('input', e => {
    document.getElementById('row-count-value').textContent = e.target.value;
  });

  document.getElementById('btn-fake-generate').addEventListener('click', generateFakeData);

  document.getElementById('btn-fields-all').addEventListener('click', () => {
    FIELD_DEFS.forEach(fd => activeFields.add(fd.id));
    refreshChips();
  });
  document.getElementById('btn-fields-none').addEventListener('click', () => {
    activeFields.clear();
    refreshChips();
  });

  document.getElementById('btn-fake-copy').addEventListener('click', async () => {
    let text = '';
    if (fakeFormat === 'table') {
      // copy as CSV when in table view
      const fields = [...activeFields];
      const labels = fields.map(fid => FIELD_DEFS.find(f => f.id === fid)?.label || fid);
      text = buildCSV(fields, labels, fakeData);
    } else {
      text = document.getElementById('fake-text-output').value;
    }
    await copyText(text, document.getElementById('btn-fake-copy'));
  });

  document.getElementById('btn-fake-download').addEventListener('click', () => {
    let text = '';
    let filename = 'fake-data';
    if (fakeFormat === 'table') {
      const fields = [...activeFields];
      const labels = fields.map(fid => FIELD_DEFS.find(f => f.id === fid)?.label || fid);
      text = buildCSV(fields, labels, fakeData);
      filename += '.csv';
    } else if (fakeFormat === 'json') {
      text = document.getElementById('fake-text-output').value;
      filename += '.json';
    } else if (fakeFormat === 'csv') {
      text = document.getElementById('fake-text-output').value;
      filename += '.csv';
    } else if (fakeFormat === 'sql') {
      text = document.getElementById('fake-text-output').value;
      filename += '.sql';
    }
    if (text) downloadText(text, filename);
  });

  // =========================================================
  // INIT
  // =========================================================
  buildFieldChips();
  generateLorem();
  </script>
</body>
</html>
