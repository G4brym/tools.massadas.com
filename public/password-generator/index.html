    // --- Cryptographic random helpers ---
    function secureRandomInt(max) {
      // Returns a uniform random integer in [0, max)
      // Uses rejection sampling to avoid modulo bias
      if (max <= 0) return 0;
      const limit = Math.floor(0xFFFFFFFF / max) * max;
      const arr = new Uint32Array(1);
      let val;
      do {
        crypto.getRandomValues(arr);
        val = arr[0];
      } while (val >= limit);
      return val % max;
    }

    function secureRandomChar(charset) {
      return charset[secureRandomInt(charset.length)];
    }

    // --- Character sets ---
    const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const LOWER = 'abcdefghijklmnopqrstuvwxyz';
    const DIGITS = '0123456789';
    const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`';
    const AMBIGUOUS = '0O1lI';

    // --- Generate password ---
    function generatePassword() {
      let charset = '';
      if (optUpper.checked) charset += UPPER;
      if (optLower.checked) charset += LOWER;
      if (optDigits.checked) charset += DIGITS;
      if (optSymbols.checked) charset += SYMBOLS;

      if (charset.length === 0) {
        // Fallback: at least lowercase
        charset = LOWER;
        optLower.checked = true;
      }

      if (optExcludeAmbiguous.checked) {
        charset = charset.split('').filter(c => !AMBIGUOUS.includes(c)).join('');
      }

      const length = parseInt(pwLength.value, 10);
      let password = '';
      for (let i = 0; i < length; i++) {
        password += secureRandomChar(charset);
      }

      return { password, entropy: Math.log2(Math.pow(charset.length, length)) };
    }

    function generatePassphrase() {

      const words = [];

        if (optCapitalize.checked) {

        }
        words.push(word);
      }
      const passphrase = words.join(separator);
      const entropy = Math.log2(Math.pow(WORDLIST.length, count));
      return { password: passphrase, entropy };
    }

      entropyLabel.textContent = bits + ' bits of entropy';

      // Map entropy to percentage (cap at 128 bits = 100%)
      const pct = Math.min(100, (bits / 128) * 100);
      strengthBar.style.width = pct + '%';

      // Color coding
      if (bits < 40) {
        strengthBar.style.background = '#ef4444'; // red
        entropyLabel.style.color = '#ef4444';
      } else if (bits < 60) {
        strengthBar.style.background = '#f59e0b'; // orange
        entropyLabel.style.color = '#f59e0b';
      } else if (bits < 80) {
        strengthBar.style.background = '#eab308'; // yellow
        entropyLabel.style.color = '#eab308';
      } else {
        strengthBar.style.background = '#22c55e'; // green
        entropyLabel.style.color = '#22c55e';
      }
    }

    // --- Generate and display ---
    function generate() {
      let result;
      if (mode === 'password') {
        result = generatePassword();
      } else {
        result = generatePassphrase();
      }
      passwordDisplay.textContent = result.password;
      updateStrengthMeter(result.entropy);
    }

    // --- Mode switching ---
    function setMode(newMode) {
      mode = newMode;
      if (mode === 'password') {
        btnModePassword.className = 'flex-1 px-4 py-2.5 text-sm font-medium bg-brand text-white transition cursor-pointer text-center';
        btnModePassphrase.className = 'flex-1 px-4 py-2.5 text-sm font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer text-center';
        passwordOptions.classList.remove('hidden');
        passphraseOptions.classList.add('hidden');
      } else {
        btnModePassphrase.className = 'flex-1 px-4 py-2.5 text-sm font-medium bg-brand text-white transition cursor-pointer text-center';
        btnModePassword.className = 'flex-1 px-4 py-2.5 text-sm font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer text-center';
        passwordOptions.classList.add('hidden');
        passphraseOptions.classList.remove('hidden');
      }
      generate();
    }

    // --- Separator button handling ---
    function setSeparator(sep) {
      separator = sep;
      sepBtns.forEach(btn => {
        if (btn.dataset.sep === sep) {
          btn.className = 'sep-btn px-4 py-1.5 text-sm font-mono rounded-lg bg-brand text-white transition cursor-pointer';
        } else {
          btn.className = 'sep-btn px-4 py-1.5 text-sm font-mono rounded-lg bg-surface border border-surface-lighter text-gray-400 hover:border-brand hover:text-brand-light transition cursor-pointer';
        }
      });
      generate();
    }

    // --- Event listeners ---
    btnGenerate.addEventListener('click', generate);

    btnCopy.addEventListener('click', async () => {
      const text = passwordDisplay.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        const orig = btnCopy.textContent;
        btnCopy.textContent = 'Copied!';
        setTimeout(() => { btnCopy.textContent = orig; }, 1500);
      } catch {
        // Fallback: create temp textarea
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const orig = btnCopy.textContent;
        btnCopy.textContent = 'Copied!';
        setTimeout(() => { btnCopy.textContent = orig; }, 1500);
      }
    });

    btnModePassword.addEventListener('click', () => setMode('password'));
    btnModePassphrase.addEventListener('click', () => setMode('passphrase'));

    // Password option listeners
    pwLength.addEventListener('input', () => {
      pwLengthValue.textContent = pwLength.value;
      generate();
    });

    [optUpper, optLower, optDigits, optSymbols, optExcludeAmbiguous].forEach(el => {
      el.addEventListener('change', generate);
    });

    // Passphrase option listeners
    ppWords.addEventListener('input', () => {
      ppWordsValue.textContent = ppWords.value;
      generate();
    });

    optCapitalize.addEventListener('change', generate);

    sepBtns.forEach(btn => {
      btn.addEventListener('click', () => setSeparator(btn.dataset.sep));
    });

    // --- Initialize ---
    generate();
  </script>
</body>
</html>
