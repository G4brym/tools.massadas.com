  <style type="text/tailwindcss">
    @theme {
      --color-brand: #6366f1;
      --color-brand-light: #818cf8;
      --color-surface: #0f172a;
      --color-surface-light: #1e293b;
      --color-surface-lighter: #334155;
      --color-err: #ef4444;
      --color-warn: #f59e0b;
      --color-ok: #22c55e;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      height: 1.25rem;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: var(--color-surface-lighter);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-brand);
      margin-top: -6px;
      border: 2px solid var(--color-surface);
    }
    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: var(--color-surface-lighter);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-brand);
      border: 2px solid var(--color-surface);
    }
    .page-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .page-card:hover {
      transform: translateY(-2px);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 0.8s linear infinite;
    }

</head>
<body class="bg-surface text-gray-100 min-h-screen antialiased">

  <!-- Top bar -->
  <header class="border-b border-surface-lighter bg-surface-light/80 backdrop-blur sticky top-0 z-50">
    <div class="flex items-center gap-4 px-4 h-12">
      <a href="/" class="text-sm text-gray-400 hover:text-brand-light transition">&larr; tools</a>
      <h1 class="text-sm font-semibold text-gray-200">PDF to Images</h1>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex flex-col gap-6">

    <!-- Drop zone -->
    <div id="drop-zone"
         class="bg-surface-light border-2 border-dashed border-surface-lighter rounded-xl p-10 flex flex-col items-center justify-center gap-3 cursor-pointer hover:border-brand transition text-center"
         role="button" tabindex="0" aria-label="Upload PDF">
      <div class="w-14 h-14 rounded-xl bg-brand/15 flex items-center justify-center text-brand-light text-2xl font-bold select-none">PDF</div>
      <p class="text-gray-300 font-medium">Drop a PDF here or <span class="text-brand-light underline underline-offset-2">click to select</span></p>
      <p class="text-xs text-gray-500">Single PDF file — all processing is local, nothing is uploaded</p>
      <input id="file-input" type="file" accept="application/pdf,.pdf" class="hidden">
    </div>

    <!-- File info banner (hidden until file loaded) -->
    <div id="file-banner" class="hidden bg-surface-light border border-surface-lighter rounded-xl px-5 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-brand/15 flex items-center justify-center text-brand-light text-xs font-bold shrink-0">PDF</div>
        <div class="min-w-0">
          <p id="file-name" class="text-sm font-medium text-gray-200 truncate"></p>
          <p id="file-meta" class="text-xs text-gray-500"></p>
        </div>
      </div>
      <button id="btn-clear" class="px-4 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-400 hover:border-err hover:text-err transition cursor-pointer shrink-0">Remove</button>
    </div>

    <!-- Controls (hidden until file loaded) -->
    <div id="controls-card" class="hidden bg-surface-light border border-surface-lighter rounded-xl p-5 flex flex-col gap-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">

        <!-- Output format -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Output Format</label>
          <div class="flex rounded-lg border border-surface-lighter overflow-hidden">
            <button data-fmt="png" class="fmt-btn flex-1 px-3 py-2 text-sm font-medium bg-brand text-white transition cursor-pointer text-center">PNG</button>
            <button data-fmt="jpeg" class="fmt-btn flex-1 px-3 py-2 text-sm font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer text-center border-x border-surface-lighter">JPEG</button>
            <button data-fmt="webp" class="fmt-btn flex-1 px-3 py-2 text-sm font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer text-center">WebP</button>
          </div>
        </div>

        <!-- Scale -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-medium text-gray-300">Resolution Scale</label>
            <span id="scale-value" class="text-sm font-mono text-brand-light">2×</span>
          </div>
          <input type="range" id="scale-input" min="1" max="4" step="0.5" value="2" class="w-full">
          <div class="flex justify-between mt-1">
            <span class="text-xs text-gray-600">1×</span>
            <span class="text-xs text-gray-600">4× (sharpest)</span>
          </div>
        </div>

        <!-- Quality (JPEG/WebP only) -->
        <div id="quality-section">
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-medium text-gray-300">Quality</label>
            <span id="quality-value" class="text-sm font-mono text-brand-light">90%</span>
          </div>
          <input type="range" id="quality-input" min="1" max="100" value="90" class="w-full">
          <div class="flex justify-between mt-1">
            <span class="text-xs text-gray-600">Low</span>
            <span class="text-xs text-gray-600">High</span>
          </div>
        </div>

      </div>

      <div class="flex flex-wrap items-center gap-3 pt-1 border-t border-surface-lighter">
        <button id="btn-render" class="px-5 py-2 text-sm font-medium rounded-lg bg-brand text-white hover:bg-brand-light transition cursor-pointer">
          Render Pages
        </button>
        <button id="btn-download-all" class="hidden px-5 py-2 text-sm font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer">
          Download All as ZIP
        </button>
        <span id="render-status" class="text-sm text-gray-500"></span>
      </div>
    </div>

    <!-- Error card -->
    <div id="error-card" class="hidden bg-err/10 border border-err/40 rounded-xl p-4 flex items-start gap-3">
      <div class="text-err mt-0.5 shrink-0">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      </div>
      <div>
        <p class="text-sm font-medium text-err">Error</p>
        <p id="error-message" class="text-sm text-err/80 mt-0.5"></p>
      </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="hidden flex flex-col items-center gap-4 py-10">
      <svg class="spinner w-10 h-10 text-brand" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="40 20" stroke-linecap="round" opacity="0.3"/>
        <path d="M12 2a10 10 0 010 20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <p id="spinner-label" class="text-sm text-gray-400">Rendering pages…</p>
      <div class="w-64 h-1.5 bg-surface-lighter rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-brand rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>

    <!-- Pages grid -->
    <div id="pages-grid" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-gray-300">
          <span id="page-count-label"></span>
        </h2>
      </div>
      <div id="pages-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

  </main>

  <!-- JSZip for ZIP download -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs';

    // --- State ---
    let currentFile = null;
    let pdfDoc = null;
    let renderedBlobs = []; // { blob, width, height, pageNum }
    let outputFormat = 'png';
    let scale = 2;
    let quality = 0.9;

    // --- Elements ---
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileBanner = document.getElementById('file-banner');
    const fileName = document.getElementById('file-name');
    const fileMeta = document.getElementById('file-meta');
    const btnClear = document.getElementById('btn-clear');
    const controlsCard = document.getElementById('controls-card');
    const fmtBtns = document.querySelectorAll('.fmt-btn');
    const scaleInput = document.getElementById('scale-input');
    const scaleValue = document.getElementById('scale-value');
    const qualitySection = document.getElementById('quality-section');
    const qualityInput = document.getElementById('quality-input');
    const qualityValue = document.getElementById('quality-value');
    const btnRender = document.getElementById('btn-render');
    const btnDownloadAll = document.getElementById('btn-download-all');
    const renderStatus = document.getElementById('render-status');
    const errorCard = document.getElementById('error-card');
    const errorMessage = document.getElementById('error-message');
    const spinner = document.getElementById('spinner');
    const spinnerLabel = document.getElementById('spinner-label');
    const progressBar = document.getElementById('progress-bar');
    const pagesGrid = document.getElementById('pages-grid');
    const pagesContainer = document.getElementById('pages-container');
    const pageCountLabel = document.getElementById('page-count-label');

    // --- Helpers ---
    function showError(msg) {
      errorMessage.textContent = msg;
      errorCard.classList.remove('hidden');
    }

    function hideError() {
      errorCard.classList.add('hidden');
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getMimeType() {
      if (outputFormat === 'jpeg') return 'image/jpeg';
      if (outputFormat === 'webp') return 'image/webp';
      return 'image/png';
    }

    function getExtension() {
      return outputFormat === 'jpeg' ? 'jpg' : outputFormat;
    }

    // --- Format toggles ---
    function setFormat(fmt) {
      outputFormat = fmt;
      fmtBtns.forEach(btn => {
        if (btn.dataset.fmt === fmt) {
          btn.className = 'fmt-btn flex-1 px-3 py-2 text-sm font-medium bg-brand text-white transition cursor-pointer text-center';
        } else {
          btn.className = 'fmt-btn flex-1 px-3 py-2 text-sm font-medium bg-surface-light text-gray-400 hover:text-gray-200 transition cursor-pointer text-center';
          // restore borders for middle button
          if (btn.dataset.fmt === 'jpeg') btn.classList.add('border-x', 'border-surface-lighter');
        }
      });
      // Quality slider only makes sense for JPEG/WebP
      if (fmt === 'png') {
        qualitySection.style.opacity = '0.4';
        qualitySection.style.pointerEvents = 'none';
      } else {
        qualitySection.style.opacity = '1';
        qualitySection.style.pointerEvents = 'auto';
      }
    }

    fmtBtns.forEach(btn => btn.addEventListener('click', () => setFormat(btn.dataset.fmt)));

    scaleInput.addEventListener('input', () => {
      scale = parseFloat(scaleInput.value);
      scaleValue.textContent = scale + '×';
    });

    qualityInput.addEventListener('input', () => {
      quality = parseInt(qualityInput.value) / 100;
      qualityValue.textContent = qualityInput.value + '%';
    });

    // --- File handling ---
    function handleFile(file) {
      if (!file || file.type !== 'application/pdf') {
        showError('Please select a valid PDF file.');
        return;
      }
      hideError();
      currentFile = file;

      // Show banner
      fileName.textContent = file.name;
      fileMeta.textContent = formatBytes(file.size);
      fileBanner.classList.remove('hidden');
      controlsCard.classList.remove('hidden');
      pagesGrid.classList.add('hidden');
      btnDownloadAll.classList.add('hidden');
      renderedBlobs = [];
      renderStatus.textContent = '';

      // Load PDF to get page count
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const typedArr = new Uint8Array(e.target.result);
          pdfDoc = await pdfjsLib.getDocument({ data: typedArr }).promise;
          fileMeta.textContent = formatBytes(file.size) + ' · ' + pdfDoc.numPages + ' page' + (pdfDoc.numPages !== 1 ? 's' : '');
        } catch (err) {
          showError('Failed to load PDF: ' + (err.message || 'The file may be corrupted or password-protected.'));
          pdfDoc = null;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('border-brand', 'bg-brand/5');
    });

    dropZone.addEventListener('dragleave', e => {
      e.preventDefault();
      dropZone.classList.remove('border-brand', 'bg-brand/5');
    });

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('border-brand', 'bg-brand/5');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    btnClear.addEventListener('click', () => {
      currentFile = null;
      pdfDoc = null;
      renderedBlobs = [];
      fileInput.value = '';
      fileBanner.classList.add('hidden');
      controlsCard.classList.add('hidden');
      pagesGrid.classList.add('hidden');
      btnDownloadAll.classList.add('hidden');
      spinner.classList.add('hidden');
      pagesContainer.innerHTML = '';
      hideError();
      renderStatus.textContent = '';
    });

    // --- Render pages ---
    btnRender.addEventListener('click', async () => {
      if (!pdfDoc) {
        showError('No PDF loaded. Please select a file first.');
        return;
      }
      hideError();
      renderedBlobs = [];
      pagesContainer.innerHTML = '';
      pagesGrid.classList.add('hidden');
      btnDownloadAll.classList.add('hidden');
      renderStatus.textContent = '';

      spinner.classList.remove('hidden');
      spinnerLabel.textContent = 'Rendering pages…';
      progressBar.style.width = '0%';
      btnRender.disabled = true;
      btnRender.classList.add('opacity-60', 'cursor-not-allowed');

      const mimeType = getMimeType();
      const ext = getExtension();
      const qualityArg = outputFormat === 'png' ? undefined : quality;
      const totalPages = pdfDoc.numPages;

      try {
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          spinnerLabel.textContent = `Rendering page ${pageNum} of ${totalPages}…`;
          progressBar.style.width = ((pageNum - 1) / totalPages * 100) + '%';

          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement('canvas');
          canvas.width = Math.round(viewport.width);
          canvas.height = Math.round(viewport.height);
          const ctx = canvas.getContext('2d');

          await page.render({ canvasContext: ctx, viewport }).promise;

          // Convert to blob
          const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, mimeType, qualityArg);
          });

          renderedBlobs.push({
            blob,
            width: canvas.width,
            height: canvas.height,
            pageNum,
            ext,
          });

          progressBar.style.width = (pageNum / totalPages * 100) + '%';
        }

        spinner.classList.add('hidden');
        buildPageGrid();
        renderStatus.textContent = totalPages + ' page' + (totalPages !== 1 ? 's' : '') + ' rendered';
        if (totalPages > 1) btnDownloadAll.classList.remove('hidden');

      } catch (err) {
        spinner.classList.add('hidden');
        showError('Rendering failed: ' + (err.message || 'Unknown error. The PDF may be corrupted.'));
      } finally {
        btnRender.disabled = false;
        btnRender.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    });

    // --- Build the grid ---
    function buildPageGrid() {
      pagesContainer.innerHTML = '';
      const baseName = currentFile.name.replace(/\.pdf$/i, '');

      renderedBlobs.forEach(({ blob, width, height, pageNum, ext }) => {
        const url = URL.createObjectURL(blob);
        const sizeLabel = width + '×' + height + ' px';
        const fileSize = formatBytes(blob.size);

        const card = document.createElement('div');
        card.className = 'page-card bg-surface-light border border-surface-lighter rounded-xl overflow-hidden flex flex-col';

        // Preview image
        const imgWrap = document.createElement('div');
        imgWrap.className = 'bg-surface flex items-center justify-center p-2 aspect-[3/4] overflow-hidden';

        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Page ' + pageNum;
        img.className = 'max-w-full max-h-full object-contain rounded shadow';
        imgWrap.appendChild(img);
        card.appendChild(imgWrap);

        // Info + download
        const info = document.createElement('div');
        info.className = 'px-3 py-2 flex flex-col gap-1.5 border-t border-surface-lighter';

        const meta = document.createElement('div');
        meta.className = 'flex items-start justify-between gap-2';

        const pageLabel = document.createElement('span');
        pageLabel.className = 'text-xs font-medium text-gray-400';
        pageLabel.textContent = 'Page ' + pageNum;

        const dims = document.createElement('span');
        dims.className = 'text-xs text-gray-600 text-right';
        dims.textContent = sizeLabel;

        meta.appendChild(pageLabel);
        meta.appendChild(dims);
        info.appendChild(meta);

        const sizeRow = document.createElement('div');
        sizeRow.className = 'text-xs text-gray-600';
        sizeRow.textContent = fileSize;
        info.appendChild(sizeRow);

        const dlBtn = document.createElement('a');
        dlBtn.href = url;
        dlBtn.download = `${baseName}-page-${String(pageNum).padStart(3, '0')}.${ext}`;
        dlBtn.className = 'mt-1 text-center px-3 py-1.5 text-xs font-medium rounded-lg bg-surface border border-surface-lighter text-gray-300 hover:border-brand hover:text-brand-light transition cursor-pointer';
        dlBtn.textContent = 'Download';
        info.appendChild(dlBtn);

        card.appendChild(info);
        pagesContainer.appendChild(card);
      });

      pageCountLabel.textContent = renderedBlobs.length + ' page' + (renderedBlobs.length !== 1 ? 's' : '');
      pagesGrid.classList.remove('hidden');
    }

    // --- Download all as ZIP ---
    btnDownloadAll.addEventListener('click', async () => {
      if (!renderedBlobs.length) return;

      btnDownloadAll.disabled = true;
      btnDownloadAll.textContent = 'Zipping…';

      try {
        const zip = new JSZip();
        const baseName = currentFile.name.replace(/\.pdf$/i, '');

        for (const { blob, pageNum, ext } of renderedBlobs) {
          const fileName = `${baseName}-page-${String(pageNum).padStart(3, '0')}.${ext}`;
          zip.file(fileName, blob);
        }

        const content = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(content);
        const a = document.createElement('a');
        a.href = url;
        a.download = baseName + '-images.zip';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (err) {
        showError('Failed to create ZIP: ' + (err.message || 'Unknown error.'));
      } finally {
        btnDownloadAll.disabled = false;
        btnDownloadAll.textContent = 'Download All as ZIP';
      }
    });

    // --- Init: set quality section to dimmed for PNG default ---
    setFormat('png');
  </script>
</body>
